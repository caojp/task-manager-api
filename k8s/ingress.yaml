apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-manager-api
  namespace: task-manager
  labels:
    app.kubernetes.io/name: task-manager-api
    app.kubernetes.io/part-of: task-manager
  annotations:
    # Minikube ingress-nginx 控制器专用注解
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # 健康检查路径
    nginx.ingress.kubernetes.io/healthz-path: "/health"
    # 限流（与应用自身限流配合）
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-burst: "200"
spec:
  # 指定 IngressClass
  ingressClassName: nginx
  rules:
    - host: task-manager.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-manager-api
                port:
                  number: 8080
