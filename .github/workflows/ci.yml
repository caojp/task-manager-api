name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/task-manager-api
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

permissions:
  contents: read
  packages: write  # 用于 push 到 GHCR

jobs:
  # ==========================================================================
  # Lint: 代码风格检查
  # ==========================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff check (lint)
        run: ruff check .

      - name: Run ruff format --check (格式校验)
        run: ruff format --check .

  # ==========================================================================
  # Test: 单元测试
  # ==========================================================================
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint  # 必须通过 lint 才能运行测试
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -v --tb=short

  # ==========================================================================
  # Build: 构建 Docker 镜像并推送到 GHCR
  # ==========================================================================
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test  # 必须通过测试才能构建
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image digest
        run: echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"

    outputs:
      image_name: ${{ env.IMAGE_NAME }}
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag_sha: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

  # ==========================================================================
  # Security Scan: Trivy 镜像漏洞扫描
  # ==========================================================================
  security-scan:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build  # 必须构建完成才能扫描
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR (pull scanned image)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.image_digest }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # 不阻断流水线，漏洞结果上传到 GitHub Security 标签页查看
          ignore-unfixed: true
          scanners: "vuln,secret,misconfig"
          args: "--skip-version-check"

      - name: Also print human-readable summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image_name }}@${{ needs.build.outputs.image_digest }}
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true
          scanners: "vuln,secret,misconfig"
          args: "--skip-version-check"

      - name: Upload Trivy scan results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
