version: "3.8"

services:
  task-manager-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: task-manager-api:latest
    container_name: task-manager-api
    ports:
      - "8080:8080"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - APP_RATE_LIMIT_ENABLED=true
      - APP_RATE_LIMIT_REQUESTS=100
      - APP_RATE_LIMIT_WINDOW_SECONDS=60
      - APP_DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys,urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read() or sys.exit(1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
